// Shairport Sync configuration file template for Music Assistant
// This file will be copied and customized for each AirPlay receiver instance

general =
{
	name = "{AIRPLAY_NAME}";
	ignore_volume_control = "yes";
	output_backend = "pipe";
	default_airplay_volume = {DEFAULT_VOLUME};
	port = {PORT};
{SERVICE_LINES}	// Advertise nothing: the service goes to the metadata pipe (as `svrg`) and
	// Music Assistant publishes it with its own mDNS responder.
	mdns_backend = "metadata";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "{METADATA_PIPE}";
	pipe_timeout = 0;  // Don't timeout, keep pipe open
};

pipe =
{
	name = "{AUDIO_PIPE}";
	// The provider reads the pipe as 16-bit 44.1 kHz stereo, which an AirPlay 2 build
	// does not default to
	output_format = "S16_LE";
	output_rate = 44100;
	output_channels = 2;
};

// Session control - playback start and end reach the metadata pipe as the 'abeg'
// and 'aend' items, sent when shairport-sync enters and leaves the active state
sessioncontrol =
{
	active_state_timeout = 10.0;  // Seconds of silence before considering playback ended
};
